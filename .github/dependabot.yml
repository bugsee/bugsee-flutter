version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: pub
    directory: /example
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  # Bugsee's own artifacts and Gradle plugin are pinned in native-versions.json and
  # asserted by the drift guard (example/android/settings.gradle.kts repeats the plugin
  # version literally), so Dependabot must never bump them: it would break the guard.
  # Only build tooling (AGP, Kotlin, etc.) is bumped here.
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "com.bugsee*"
  - package-ecosystem: gradle
    directory: /example/android
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "com.bugsee*"
