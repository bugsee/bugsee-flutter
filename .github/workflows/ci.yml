name: ci

on:
  push:
    branches: [nextgen, main]
  pull_request:

permissions:
  contents: read

# A newer push to the same PR supersedes its running (and pending) run. Every push to
# nextgen/main gets its own group (its SHA), so a queued run is never replaced by a
# later commit and every merged commit keeps a complete result.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Pinned to the floor: formatter output changes between Dart releases, and a
      # moving `stable` would fail unrelated PRs the day a new style ships.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.0'
          cache: true
      - run: flutter config --enable-swift-package-manager
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test example/lib example/integration_test scripts pigeons packages

  # The committed Dart/Java/Swift bridge files must be what pigeons/bridge.dart generates
  # with the pinned pigeon (native-versions.json `pigeon.version`). On the floor, like
  # `format`: the generated Dart is dart-formatted, and formatter output varies by release.
  bridge-codegen:
    name: bridge codegen is current
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.0'
          cache: true
      - run: dart scripts/generate_pigeon.dart --check
      # The feedback package has its own bridge (the core's is not widened for it).
      - run: dart scripts/generate_pigeon.dart --package packages/bugsee_flutter_feedback --check
      # Excluded from the root analysis (its package needs its own pub get, done by the lines above).
      - run: cd pigeons && dart analyze --fatal-infos
      - run: cd packages/bugsee_flutter_feedback/pigeons && dart analyze --fatal-infos

  # The typed BugseeOptions and the option registry are generated from the manifests the two SDKs
  # publish (vendored in test/fixtures/option_manifests), so this works offline. On the floor,
  # like `format` and `bridge-codegen`: the generated Dart is dart-formatted. The refetch of the
  # manifests (network) and the read of the SDK source (private checkouts) are not here: see
  # CI.md ("Option registry").
  options-codegen:
    name: option registry is current
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.0'
          cache: true
      - run: dart scripts/generate_options.dart --check

  test:
    name: analyze + test + ios build (${{ matrix.channel }})
    # macOS: SwiftPM only exists there, and the plugin is SwiftPM-only.
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # The floor, from native-versions.json (flutter.min); the drift guard asserts it.
          - channel: floor
            flutter-version: '3.41.0'
          - channel: stable
            flutter-version: ''
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '21'   # 17 or 21 only; see native-versions.json android.jdk
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter-version }}
          cache: true
      # The plugin is SwiftPM-only (Bugsee publishes no pod); older Flutter needs it enabled.
      - run: flutter config --enable-swift-package-manager
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # The feedback package (a member of the same pub workspace): its own analysis and tests.
      - run: cd packages/bugsee_flutter_feedback && flutter analyze
      - run: cd packages/bugsee_flutter_feedback && flutter test
      # The example app uses BOTH packages, so this builds the feedback add-on (SwiftUI, from
      # feedback-spm) into an iOS app next to the core.
      - run: cd example && flutter build ios --debug --no-codesign
      # XCTest of the Objective-C wrapper target (lifecycle hub, secure-rectangle store)
      # in the test-only package ios/wrapper_tests; independent of Flutter, so once is enough.
      - name: iOS wrapper unit tests
        if: matrix.channel == 'stable'
        run: |
          UDID=$(xcrun simctl list devices available -j | jq -r '[.devices | to_entries[] | select(.key | test("SimRuntime\\.iOS")) | .value[] | select(.name | startswith("iPhone"))][0].udid // empty')
          if [ -z "$UDID" ]; then
            echo "::error::no available iPhone simulator on this runner"
            xcrun simctl list devices available
            exit 1
          fi
          echo "simulator: $UDID"
          cd ios/wrapper_tests
          xcodebuild test -scheme bugsee_flutter_wrapper_tests -destination "platform=iOS Simulator,id=$UDID"
          cd ../../packages/bugsee_flutter_feedback/ios/feedback_wrapper_tests
          xcodebuild test -scheme bugsee_flutter_feedback_wrapper_tests -destination "platform=iOS Simulator,id=$UDID"

  build-android:
    name: build apk (${{ matrix.channel }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # 3.41.0 is the first Flutter where a SwiftPM-only plugin resolves on Linux
    # (measured across 3.27-3.38; see native-versions.json flutter.provenance).
    strategy:
      fail-fast: false
      matrix:
        include:
          - channel: floor
            flutter-version: '3.41.0'
          - channel: stable
            flutter-version: ''
    steps:
      # The runner disk fills up during the debug APK build ("No space left on device").
      - run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '21'   # 17 or 21 only; see native-versions.json android.jdk
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter-version }}
          cache: true
      - run: flutter config --enable-swift-package-manager
      - run: flutter pub get
      # The example app uses both packages: the APK carries the feedback module next to the core.
      - run: cd example && flutter build apk --debug
      # JUnit tests of the wrapper and its init provider (android/src/test) and of the feedback
      # package's glue (packages/bugsee_flutter_feedback/android/src/test).
      - run: cd example/android && ./gradlew :bugsee_flutter:testDebugUnitTest :bugsee_flutter_feedback:testDebugUnitTest

  publish-check:
    # Package validity only: `--dry-run` never uploads and needs no credentials.
    name: pub publish dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # On the floor, like `format`: the oldest supported toolchain must accept the package.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.0'
          cache: true
      - run: flutter config --enable-swift-package-manager
      - run: flutter pub get
      - run: flutter pub publish --dry-run
      # The sibling package, published separately (the core first: it depends on it).
      - run: cd packages/bugsee_flutter_feedback && flutter pub publish --dry-run

  # The one stable name for branch protection: require `ci-ok` and nothing else, so
  # matrix legs can be renamed or added without touching repository settings.
  ci-ok:
    name: ci-ok
    # Must be `always()`, not `!cancelled()`: a skipped required check counts as passing,
    # so on a cancelled run ci-ok has to run and fail (cancelled needed jobs fail it below).
    if: always()
    needs: [format, bridge-codegen, options-codegen, test, build-android, publish-check]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every needed job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null
