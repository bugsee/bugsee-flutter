name: ci

on:
  push:
    branches: [nextgen, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: analyze + test + ios build (${{ matrix.channel }})
    # macOS: SwiftPM only exists there, and the plugin is SwiftPM-only.
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The floor, from native-versions.json (flutter.min); the drift guard asserts it.
          - channel: floor
            flutter-version: '3.41.0'
          - channel: stable
            flutter-version: ''
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '21'   # 17 or 21 only; see native-versions.json android.jdk
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter-version }}
      # The plugin is SwiftPM-only (Bugsee publishes no pod); older Flutter needs it enabled.
      - run: flutter config --enable-swift-package-manager
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: cd example && flutter build ios --debug --no-codesign

  build-android:
    name: build apk (${{ matrix.channel }})
    runs-on: ubuntu-latest
    # 3.41.0 is the first Flutter where a SwiftPM-only plugin resolves on Linux
    # (measured across 3.27-3.38; see native-versions.json flutter.provenance).
    strategy:
      fail-fast: false
      matrix:
        include:
          - channel: floor
            flutter-version: '3.41.0'
          - channel: stable
            flutter-version: ''
    steps:
      # The runner disk fills up during the debug APK build ("No space left on device").
      - run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '21'   # 17 or 21 only; see native-versions.json android.jdk
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter-version }}
      - run: flutter config --enable-swift-package-manager
      - run: flutter pub get
      - run: cd example && flutter build apk --debug
