name: ci

on:
  push:
    branches: [nextgen, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: analyze + test (${{ matrix.channel }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The floor, from native-versions.json (flutter.min); the drift guard asserts it.
          - channel: floor
            flutter-version: '3.27.0'
          - channel: stable
            flutter-version: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'   # 17 or 21 only; see native-versions.json android.jdk
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter-version }}
      # The plugin is SwiftPM-only (Bugsee publishes no pod); older Flutter needs it enabled.
      - run: flutter config --enable-swift-package-manager
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
