// package plugin.android

buildscript {
    repositories {
        google()
        jcenter()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:7.4.2'
    }
}

plugins {
    id 'com.android.library'
}

group 'com.bugsee.bugsee'
version '99.99.99'

rootProject.allprojects {
    repositories {
        google()
        jcenter()
    }

//    gradle.projectsEvaluated {
//        tasks.withType(JavaCompile) {
//            options.compilerArgs << "-Xlint:deprecation"
//        }
//    }
}

def bgsGetExtPropSafe(prop, fallback) {
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

android {
    namespace 'com.bugsee.bugsee'
    compileSdkVersion bgsGetExtPropSafe('compileSdkVersion', 34)
    buildToolsVersion bgsGetExtPropSafe('buildToolsVersion', '34.0.0')

    defaultConfig {
        minSdkVersion 21
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
    }
    lintOptions {
        disable 'InvalidPackage'
    }

    dependencies {
        implementation 'com.bugsee:bugsee-android:5.4.2'
    }
}
