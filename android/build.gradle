// package plugin.android

group 'com.bugsee.bugsee'
version '99.99.99'

buildscript {
    repositories {
        google()
        jcenter()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:3.1.1'
    }
}

rootProject.allprojects {
    repositories {
        google()
        jcenter()
    }

//    gradle.projectsEvaluated {
//        tasks.withType(JavaCompile) {
//            options.compilerArgs << "-Xlint:deprecation"
//        }
//    }
}

apply plugin: 'com.android.library'

def bgsGetExtPropSafe(prop, fallback) {
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

android {
    compileSdkVersion bgsGetExtPropSafe('compileSdkVersion', 31)
    buildToolsVersion bgsGetExtPropSafe('buildToolsVersion', '31.0.0')

    defaultConfig {
        minSdkVersion 21
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
    }
    lintOptions {
        disable 'InvalidPackage'
    }

    dependencies {
        implementation 'com.bugsee:bugsee-android:3.10.0'
    }
}
