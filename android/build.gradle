group = "com.bugsee.flutter"
version = "1.0"

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.11.1")
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"

// The single source of every native pin. It sits at the package root, one level
// above this module, both in this repo and in an app's pub cache.
def nativeVersionsFile = new File(projectDir.canonicalFile.parentFile, "native-versions.json")
if (!nativeVersionsFile.isFile()) {
    throw new GradleException("native-versions.json not found at ${nativeVersionsFile}")
}
def nativeVersions = new groovy.json.JsonSlurper().parse(nativeVersionsFile)

// The wrapper version is the plugin's own version: `version:` in pubspec.yaml,
// which sits next to native-versions.json. Read here so the provider, which
// registers before Dart exists, cannot disagree with the package.
def pubspecFile = new File(projectDir.canonicalFile.parentFile, "pubspec.yaml")
if (!pubspecFile.isFile()) {
    throw new GradleException("pubspec.yaml not found at ${pubspecFile}")
}
def wrapperVersionMatch = (pubspecFile.getText("UTF-8") =~ /(?m)^version:[ \t]*(?!#)(\S+)[ \t]*(?:#.*)?$/)
if (!wrapperVersionMatch.find()) {
    throw new GradleException("no top-level `version:` in ${pubspecFile}")
}
def wrapperVersion = wrapperVersionMatch.group(1)

android {
    namespace = "com.bugsee.flutter"

    compileSdk = 35

    compileOptions {
        // The SDK compiles at 1.8; a wrapper must not emit newer bytecode than the
        // library it bridges to.
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // The SDK's own floor; a wrapper must not raise it.
        minSdk = nativeVersions.android.minSdk

        // Read by FlutterWrapperInitProvider, which registers the wrapper before
        // Dart exists and so cannot be handed this.
        buildConfigField "String", "WRAPPER_VERSION", "\"${wrapperVersion}\""
    }

    buildFeatures {
        buildConfig = true
    }

    dependencies {
        api "com.bugsee:bugsee-android:${nativeVersions.android.sdk}"
        // Native crash detection is a SEPARATE artefact. Without it the SDK looks
        // correctly integrated, builds green, and reports no native crash at all
        // (workbook 1.2). `api`, like the core, so apps can configure NdkOptions.
        api "com.bugsee:bugsee-android-ndk:${nativeVersions.android.sdk}"

        testImplementation("junit:junit:4.13.2")
        // The Android SDK's own org.json is the platform stub in a unit test (it parses nothing);
        // the option tests read the vendored manifests (test/fixtures/option_manifests).
        testImplementation("org.json:json:20240303")
    }

    testOptions {
        // android.util.Log in the provider's never-throws path.
        unitTests.returnDefaultValues = true
        unitTests.all {
            testLogging {
               events "passed", "skipped", "failed"
            }
        }
    }
}
