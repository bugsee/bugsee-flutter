name: bugsee_flutter
description: Bugsee adds video, network traffic, console logs and other traces from your app to every bug and crash report.
version: 10.0.0-dev.1
homepage: https://www.bugsee.com/
documentation: https://docs.bugsee.com/sdk/flutter/installation/
repository: https://github.com/bugsee/bugsee-flutter
issue_tracker: https://github.com/bugsee/bugsee-flutter/issues

environment:
  # Floors come from native-versions.json (flutter.min / flutter.dart).
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  # Imported by the generated bridge (lib/src/bridge/messages.g.dart); the floor
  # Flutter (3.41.0) ships 1.17.0.
  meta: ^1.17.0
  # Parses the stack of a Dart error into frames (VM, `package:stack_trace` and async-gap formats);
  # Flutter 3.41.0 pins 1.12.1 for flutter_test.
  stack_trace: ^1.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.bugsee.flutter
        pluginClass: BugseeFlutterPlugin
      ios:
        pluginClass: BugseeFlutterPlugin
