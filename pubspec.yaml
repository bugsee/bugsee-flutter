name: bugsee_flutter
description: Bugsee Flutter SDK
version: 99.99.99
homepage: https://www.bugsee.com/
documentation: https://docs.bugsee.com/sdk/flutter/installation/
issue_tracker: https://github.com/bugsee/flutter-bugsee/issues
repository: https://github.com/bugsee/flutter-bugsee

environment:
  sdk: ">=2.12.0 <3.0.0"
  flutter: ">=2.0.0"

dependencies:
  flutter:
    sdk: flutter
  stack_trace: ">=1.0.0 <2.0.0"
  crypto: "^3.0.1"
  convert: "^3.0.1"
  uuid: "^3.0.5"

flutter:
  plugin:
    platforms:
      android:
        package: com.bugsee
        pluginClass: BugseePlugin
      ios:
        pluginClass: BugseePlugin
