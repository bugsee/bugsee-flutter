name: bugsee_flutter
description: Bugsee is a mobile SDK that adds crucial information to your bug and crash reports incuding video, network traffic, console logs and many other important traces from your app.
version: 99.99.99
homepage: https://www.bugsee.com/
documentation: https://docs.bugsee.com/sdk/flutter/installation/
issue_tracker: https://github.com/bugsee/flutter-bugsee/issues
repository: https://github.com/bugsee/flutter-bugsee

environment:
  sdk: ^3.0.0
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  stack_trace: ">=1.0.0 <2.0.0"
  crypto: ^3.0.3
  convert: ^3.1.1

dev_dependencies:
  lints: ^3.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.bugsee
        pluginClass: BugseePlugin
      ios:
        pluginClass: BugseePlugin
