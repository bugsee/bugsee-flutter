name: bugsee_flutter
description: Bugsee is a mobile SDK that adds crucial information to your bug and crash reports. Bugsee reports include video of user actions, network traffic, console logs and many other important traces from your app. Now you know what exactly led to the unexpected behavior.
version: 99.99.99
homepage: https://www.bugsee.com/
documentation: https://docs.bugsee.com/sdk/flutter/installation/
issue_tracker: https://github.com/bugsee/flutter-bugsee/issues
repository: https://github.com/bugsee/flutter-bugsee

environment:
  sdk: ">=2.12.0 <3.0.0"
  flutter: ">=2.0.0"

dependencies:
  flutter:
    sdk: flutter
  stack_trace: ">=1.0.0 <2.0.0"
  crypto: "^3.0.1"
  convert: "^3.0.1"
  uuid: "^3.0.5"

flutter:
  plugin:
    platforms:
      android:
        package: com.bugsee
        pluginClass: BugseePlugin
      ios:
        pluginClass: BugseePlugin
